site:
  name: 'Team Odyssey'
  site: 'https://records.teamodyssey.space/'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: 'Team Odyssey'
    template: '%s — Team Odyssey'
  description: 'The Team Odyssey archive. Past seasons and the current team, kept in one scrapbook.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: TeamOdyssey
    images:
      - url: '~/assets/images/og.png'
        width: 1416
        height: 801
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
